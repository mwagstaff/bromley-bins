<!DOCTYPE html>
<html lang="en-gb"><head><title>Your bin days</title></head><body>
<main class="govuk-main-wrapper">
<div class="govuk-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1" data-module="govuk-error-summary">
        <h2 class="govuk-error-summary__title" id="error-summary-title">
            There is a problem
        </h2>
        <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
                <li>
                    <a href="#form-postcode-row">Sorry, we did not find any results for that postcode</a>
                </li>
            </ul>
        </div>
    </div>
    </div>
    <main id="front-main">
      <div id="front-main-container">
        <h1>Bins, rubbish and recycling</h1>
        <form class="postcode-form-box" method="post" id="postcodeForm">
          <label for="pc">Postcode</label>
          <div>
              <input type="text" name="postcode" value="" id="pc" size="10" maxlength="200" required aria-describedby="pc-hint">
              <input type="submit" id="sub" value="Go">
          </div>
          <ul>
            <li>Find your bin collection days</li>
            <li>Report a missed bin collection</li>
                <li>Order new or additional bins</li>
            <li>Subscribe to the garden waste collection service</li>
              <li>Book a bulky waste collection</li>
          </ul>
      </form>
</main></body></html>
